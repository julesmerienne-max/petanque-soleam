<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournoi de Pétanque — SOLEAM 70 ans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    /* Palette recalée sur la charte SOLEAM : bleu nuit officiel (#223958) comme base,
       jaune officiel (#f9c24d) comme accent principal, rouge officiel (#e33134) pour les litiges.
       Le thème reste sombre (meilleur contraste en plein soleil qu'un fond clair qui reflète) :
       on garde donc des dérivés plus foncés/plus clairs du bleu nuit plutôt que le bleu ciel
       officiel en fond, qui serait trop proche du texte clair en luminosité. */
    --navy-deep:#152740;
    --navy-surface:#1c3454;
    --navy-card:#223958; /* = Bleu nuit SOLEAM officiel */
    --line:#3a577c;
    --sable:#f9c24d; /* = Jaune SOLEAM officiel */
    --sable-soft:#fcd77e;
    --bleu-ciel:#6d9bd6; /* = Bleu ciel SOLEAM officiel, éclairci pour rester lisible en accent
                             sur fond sombre — sert à distinguer visuellement l'onglet Consolante
                             du tableau principal (jaune), pas juste décoratif */
    --rouille:#e33134; /* = Rouge SOLEAM officiel */
    --vert:#4f9d69; /* hors charte : conservé pour le statut "Terminé", le vert est le seul
                        code couleur universellement lu comme "OK" en un coup d'œil sur le terrain */
    --text:#f7f5f0;
    --text-dim:#b7c4d6;
    --text-faint:#7c93ac;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Source Sans 3',-apple-system,sans-serif;
    background:var(--navy-deep);
    color:var(--text);
    min-height:100vh;
    padding-bottom:60px;
  }
  .display{font-family:'Raleway',sans-serif; font-weight:800;}

  header{
    padding:20px 18px 0;
    border-bottom:1px solid var(--line);
    /* Voile allégé : l'ancien réglage (90 -> 97 % d'opacité) rendait la photo
       quasi invisible. Ici 58 % en haut, 84 % en bas — le dégradé garde le texte
       lisible en bas là où il est dense, et laisse respirer le ciel et les
       platanes en haut. */
    background:
      radial-gradient(480px 220px at 78% -30%, rgba(249,194,77,0.13), transparent 70%),
      linear-gradient(180deg, rgba(21,39,64,0.58) 0%, rgba(21,39,64,0.72) 45%, rgba(21,39,64,0.88) 100%),
      url('photo-terrain.jpg');
    background-size:auto, auto, cover;
    background-position:center, center, center 40%;
    position:sticky; top:0; z-index:20;
    overflow:hidden;
  }
  .date-badge{
    position:absolute; top:18px; right:16px;
    display:flex; align-items:center; gap:2px; height:46px;
  }
  .date-badge img{height:46px; width:auto;}
  .date-badge img.sep{height:27px; opacity:0.8; margin:0 3px; align-self:center;}
  .eyebrow{
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--sable); font-weight:700; margin-bottom:8px;
    cursor:default; user-select:none; display:inline-block;
  }
  h1{
    font-family:'Raleway',sans-serif; font-weight:800;
    font-size:27px; line-height:1.05; letter-spacing:-0.01em;
    display:flex; align-items:baseline; gap:11px; flex-wrap:wrap;
  }
  h1 .num{font-size:46px; font-weight:800; color:var(--sable-soft); letter-spacing:-0.02em;}
  .meta{font-size:12.5px; color:var(--text-dim); margin-top:8px; padding-bottom:18px;}

  .tabs{
    display:flex; gap:6px; margin-top:18px; background:var(--navy-deep);
    border:1px solid var(--line); border-radius:12px; padding:4px;
  }
  .tab{
    flex:1; text-align:center; padding:10px 8px; border-radius:9px;
    font-size:13px; font-weight:700; cursor:pointer; color:var(--text-dim);
    transition:all .15s;
  }
  .tab.active{background:var(--sable); color:#20140a;}
  .tab.active[data-tab="consolante"]{background:var(--bleu-ciel); color:#0c1c30;}

  .bandeau{
    height:14px; margin:16px -18px 0; background-size:cover; background-position:center;
    background-image:url('bandeau-soleam.png'); background-repeat:no-repeat; background-size:100% auto;
    opacity:0.9;
  }

  main{padding:18px 14px; max-width:980px; margin:0 auto;}

  .sync{
    display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; color:var(--text-faint); margin-bottom:16px;
    padding:0 2px;
  }
  .sync .dot{color:var(--vert); margin-right:5px;}
  .sync button{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    border-radius:7px; padding:5px 10px; font-size:11.5px; cursor:pointer;
  }

  .round-title{
    font-size:12px; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--text-faint); margin:20px 0 10px; font-weight:700;
    position:relative; z-index:1; padding-left:2px;
  }
  .round-title:first-child{margin-top:0;}
  .round-title .rnum{
    position:absolute; left:-6px; top:-19px; height:56px; width:auto;
    opacity:0.16; z-index:-1; pointer-events:none;
  }

  /* Format tableau : un seul bloc encadré par tour, les matchs sont des lignes
     séparées par un filet — au lieu de 8 cartes flottantes espacées de 10 px.
     Chaque match occupe 2 lignes (une par équipe) pour accepter des noms de
     n'importe quelle longueur sans troncature. */
  .matches-col{
    display:block; margin-bottom:6px;
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    background:var(--navy-card);
  }

  .match{
    padding:11px 13px 10px; cursor:pointer;
    border-top:1px solid rgba(58,87,124,0.55);
    transition:background .15s;
    position:relative;
  }
  .match:first-child{border-top:none;}
  .match:active{background:rgba(109,155,214,0.09);}
  /* Filet de statut sur le bord gauche : lisible d'un coup d'œil en balayant
     la colonne, sans consommer de largeur pour du texte. */
  .match::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:transparent;
  }
  .match.termine::before{background:var(--vert);}
  .match.litige::before{background:var(--rouille);}
  .match.litige{background:rgba(227,49,52,0.09);}
  .match.attente{opacity:0.5; cursor:default;}

  .match-row{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:12px; padding:2px 0;
  }
  /* Le nom prend toute la largeur restante et passe à la ligne si besoin :
     c'est le choix assumé de la variante "noms libres". */
  .team-name{font-size:14px; font-weight:500; flex:1; min-width:0; line-height:1.3;}
  .team-name.winner{color:var(--sable-soft); font-weight:700;}
  /* tabular-nums : les chiffres ont tous la même largeur, donc les scores
     restent alignés verticalement d'une ligne à l'autre. */
  .team-score{
    font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;
    color:var(--text-dim); flex:0 0 auto; min-width:26px; text-align:right;
  }
  /* Le cerclage est posé en background de l'élément lui-même, pas en
     pseudo-élément à z-index négatif. Un z-index:-1 se peint avant les fonds
     des blocs parents : le fond de la ligne recouvrait le trait rouge, qui
     n'était donc jamais visible. Ici le texte se dessine par-dessus son propre
     fond, sans dépendre d'aucun contexte d'empilement. */
  .team-score.winner{
    color:var(--sable-soft);
    display:inline-block; min-width:38px; text-align:center;
    padding:7px 13px; margin:-5px -7px -5px 0;
    background-image:url('entourage-gagnant.png');
    background-size:100% 100%; background-repeat:no-repeat;
    background-position:center;
  }
  .vs-mini{display:none;}

  .badge{
    display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.05em; padding:2px 7px; border-radius:5px; margin-top:6px;
  }
  /* Ligne de badges : le terrain d'abord, c'est l'information que les joueurs
     cherchent en priorité — où dois-je aller ? Le statut vient ensuite. */
  .badge-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:6px;}
  .badge-row .badge{margin-top:0;}
  .badge.terrain{
    background:rgba(109,155,214,0.22); color:#9dc0ea;
    border:1px solid rgba(109,155,214,0.35);
  }
  .badge.attente{background:rgba(159,179,192,0.15); color:var(--text-dim);}
  .badge.jouer{background:rgba(217,165,74,0.18); color:var(--sable-soft);}
  .badge.partiel{background:rgba(217,165,74,0.18); color:var(--sable-soft);}
  .badge.litige{background:rgba(193,98,47,0.22); color:#e8956a;}
  .badge.termine{background:rgba(79,157,105,0.18); color:#7bc491;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(5,12,18,0.75);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--navy-surface); border:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:22px 20px 26px; width:100%;
    max-width:480px; max-height:88vh; overflow-y:auto;
  }
  @media(min-width:600px){
    .overlay{align-items:center;}
    .sheet{border-radius:16px;}
  }
  .sheet h2{font-size:17px; margin-bottom:4px;}
  .sheet .sub{font-size:12.5px; color:var(--text-dim); margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px;}
  .score-pair{display:flex; gap:10px;}
  .score-pair .field{flex:1;}
  input[type=number], input[type=text], select{
    width:100%; background:var(--navy-card); border:1px solid var(--line);
    color:var(--text); border-radius:10px; padding:12px; font-size:16px;
    font-family:'Source Sans 3',sans-serif;
  }
  input:focus, select:focus{outline:2px solid var(--sable); outline-offset:1px;}
  .tie-note{
    font-size:12px; color:var(--sable-soft); background:rgba(217,165,74,0.1);
    border-radius:8px; padding:10px 12px; margin-bottom:14px; line-height:1.4;
  }
  .btn-row{display:flex; gap:10px; margin-top:18px;}
  button.primary{
    flex:1; background:var(--sable); color:#20140a; border:none;
    border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer;
  }
  button.ghost{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    border-radius:10px; padding:14px 18px; font-size:14px; cursor:pointer;
  }
  .submissions-view{margin-bottom:16px;}
  .sub-row{
    display:flex; justify-content:space-between; padding:9px 0;
    border-bottom:1px solid var(--line); font-size:13px;
  }
  .sub-row:last-child{border-bottom:none;}
  .sub-row .who{color:var(--text-dim);}
  .close-x{
    position:absolute; top:16px; right:16px; background:none; border:none;
    color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1;
  }
  .sheet{position:relative;}
  .err-msg{color:#e8956a; font-size:12.5px; margin-top:10px; text-align:center;}

  /* Admin */
  .admin-banner{
    background:rgba(193,98,47,0.15); border:1px solid rgba(193,98,47,0.4);
    color:#e8956a; font-size:12px; padding:10px 14px; border-radius:10px;
    margin-bottom:16px; font-weight:600;
  }
  .admin-section{
    background:var(--navy-surface); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-bottom:16px;
  }
  .admin-section h3{font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin-bottom:12px;}
  .team-edit-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .team-edit-row span{font-size:11px; color:var(--text-faint); width:20px;}
  .litige-card{
    background:var(--navy-card); border:1px solid rgba(193,98,47,0.4);
    border-radius:12px; padding:14px; margin-bottom:12px;
  }
  .danger-btn{
    background:none; border:1px solid var(--rouille); color:var(--rouille);
    border-radius:10px; padding:12px; font-size:13px; font-weight:600;
    cursor:pointer; width:100%;
  }
  .empty{color:var(--text-faint); font-size:13px; text-align:center; padding:20px 0;}
  .save-row{display:flex; gap:10px; margin-top:8px;}
</style>
</head>
<body>

<header>
  <img src="logo-soleam-blanc.png" alt="SOLEAM" style="height:46px; margin-bottom:16px; display:block;">
  <div class="date-badge" aria-hidden="true">
    <img src="digit-1.png" alt="">
    <img src="digit-8.png" alt="">
    <img class="sep" src="slash-date.png" alt="">
    <img src="digit-0.png" alt="">
    <img src="digit-9.png" alt="">
  </div>
  <div class="eyebrow" id="modeLabel">Tournoi</div>
  <h1><span class="num">70</span> <span>ans SOLEAM</span></h1>
  <div class="meta">Tournoi de pétanque · Triplettes · 18 sept. 2026 · La Ciotat</div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="principal">Tableau principal</div>
    <div class="tab" data-tab="consolante">Consolante</div>
  </div>
  <div class="bandeau"></div>
</header>

<main>
  <div class="sync" id="syncBar">
    <span><span class="dot">●</span> <span id="syncTxt">connexion…</span> <span style="color:#5a708c;">· v11</span></span>
    <button id="refreshBtn">Actualiser</button>
  </div>

  <div id="publicView"></div>
  <div id="adminView" style="display:none;"></div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// ====== CONFIG ======
// La clé anon est publique par design : elle est livrée dans le JS à chaque
// navigateur. Ce n'est pas un secret. La protection vient des policies RLS
// définies sur la table (lecture/écriture ouvertes, AUCUNE suppression possible),
// pas de la confidentialité de la clé.
const SUPABASE_URL = 'https://etnzcjozmblbufojvtok.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0bnpjam96bWJsYnVmb2p2dG9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTA0MzgsImV4cCI6MjEwMDk2NjQzOH0.3Atj7XbCnNUDGXsY80HmrR1dvy0htAxOu3CuiR5llBI';
// Code d'accès à la vue organisateur. À changer avant le jour J.
// Rappel : ce code est lisible dans le source par n'importe qui. Il filtre les
// curieux, pas les déterminés. C'est pourquoi aucune action destructive n'est
// accessible depuis la vue organisateur.
const ADMIN_CODE = 'SOLEAM70';
// ====================

// ---------- Couche de stockage ----------
// Aucune librairie externe. L'ancienne version chargeait supabase-js (60 Ko) depuis
// un CDN tiers AVANT de pouvoir afficher quoi que ce soit : si ce CDN était lent ou
// filtré par le réseau, l'app restait bloquée sur "connexion…" sans message d'erreur.
// Supabase expose une API REST standard ; deux appels fetch suffisent.
const REST = SUPABASE_URL + '/rest/v1/tournoi_kv';
const HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json'
};

// Toute requête abandonne au bout de 8 secondes. Sans ça, un réseau qui ne répond
// pas (plutôt qu'un réseau qui refuse) laisse l'app attendre indéfiniment.
async function req(url, options = {}){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const r = await fetch(url, {...options, headers:{...HEADERS, ...(options.headers||{})}, signal:ctrl.signal});
    if(!r.ok){
      const detail = (await r.text()).slice(0,200);
      throw new Error(`HTTP ${r.status} — ${detail}`);
    }
    return r;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('délai dépassé (8 s) — réseau trop lent ou injoignable');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

// Lecture de TOUTE la table en une requête : 24 matchs + les équipes.
async function kvGetAll(){
  const r = await req(REST + '?select=key,value');
  const out = {};
  for(const row of await r.json()) out[row.key] = row.value;
  return out;
}

// Lecture d'une clé unique, utilisée juste avant une écriture pour repartir
// de l'état le plus frais (saisie de score, résolution de litige).
async function kvGet(key){
  const r = await req(REST + '?select=value&key=eq.' + encodeURIComponent(key));
  const d = await r.json();
  return d.length ? d[0].value : null;
}

// Écriture groupée. "resolution=merge-duplicates" = upsert sur la clé primaire.
async function kvSetMany(entries){
  const now = new Date().toISOString();
  const rows = entries.map(([key, value]) => ({ key, value, updated_at: now }));
  await req(REST, {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(rows)
  });
  return true;
}
async function kvSet(key, value){ return kvSetMany([[key, value]]); }

// Échappement de tout ce qui vient de la saisie utilisateur (noms d'équipe).
// Sans ça, un nom contenant un guillemet double casse l'attribut HTML dans
// lequel il est injecté, et l'affichage admin part en vrille.
function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const KEY_EQUIPES = 'petanque-equipes';
const KEY_TERRAINS = 'petanque-terrains';

// Affectation des terrains, par vagues simultanées.
// Le tableau principal et la consolante tournent EN PARALLÈLE, ce qui fait que
// les vagues 1 et 2 occupent exactement les 8 terrains : 16 équipes qui perdent
// ou gagnent restent 16 équipes au tour suivant tant que la consolante tourne.
//   Vague 1 : 8 huitièmes                       -> T1 à T8
//   Vague 2 : 4 quarts + 4 consolante           -> T1 à T8
//   Vague 3 : 2 demi-finales                    -> T1 et T2
//   Vague 4 : finale                            -> T1
// La consolante s'arrête après la vague 2 : chaque perdant du 1er tour n'y joue
// qu'un seul match, et un classement départage les 8 équipes.
// Valeurs par défaut seulement : l'organisateur peut tout réaffecter, et son
// choix est stocké en base pour que les 44 téléphones le voient aussitôt.
const TERRAINS_DEFAUT = {
  'P1-1':1,'P1-2':2,'P1-3':3,'P1-4':4,'P1-5':5,'P1-6':6,'P1-7':7,'P1-8':8,
  'P2-1':1,'P2-2':2,'P2-3':3,'P2-4':4,
  'C1-1':5,'C1-2':6,'C1-3':7,'C1-4':8,
  'P3-1':1,'P3-2':2,
  'P4-1':1
};
let terrains = Object.assign({}, TERRAINS_DEFAUT);

// Numéro de vague : la consolante a toujours un tour de retard sur le principal,
// puisqu'elle se peuple avec les perdants du 1er tour.
function vagueDe(id){
  const t = TOPOLOGY[id];
  return t.bracket === 'principal' ? t.round : t.round + 1;
}
const KEY_MATCH_PREFIX = 'petanque-match-';
// Identifiant d'appareil, conservé d'une visite à l'autre.
// L'ancienne version le tirait au hasard à CHAQUE chargement : il ne survivait
// pas à un rafraîchissement, ce qui rendait inopérant tout contrôle fondé sur
// "quel téléphone a saisi quoi". Stocké dans le navigateur, il identifie
// durablement l'appareil — sans rien révéler de la personne.
const DEVICE = (function(){
  const neuf = () => 'D-' + Math.random().toString(36).slice(2,7).toUpperCase();
  try{
    let d = localStorage.getItem('petanque-device');
    if(!d){ d = neuf(); localStorage.setItem('petanque-device', d); }
    return d;
  }catch(e){
    // Navigation privée ou stockage refusé : on retombe sur un identifiant
    // de session. Le contrôle sera moins strict, l'app reste utilisable.
    return neuf();
  }
})();
let IS_ADMIN = sessionStorage.getItem('petanque-admin') === '1';

// Déclencheur discret : taper 5 fois sur "Tournoi" en haut à gauche dans les 2,5s.
(function setupAdminTrigger(){
  let taps = 0, timer = null;
  document.getElementById('modeLabel')?.addEventListener('click', ()=>{
    taps++;
    clearTimeout(timer);
    timer = setTimeout(()=>{ taps = 0; }, 2500);
    if(taps >= 5){
      taps = 0;
      const code = prompt('Code organisateur :');
      if(code === ADMIN_CODE){
        sessionStorage.setItem('petanque-admin','1');
        location.reload();
      } else if(code !== null){
        alert('Code incorrect.');
      }
    }
  });
})();

// ---- Topologie fixe du bracket ----
// feedsTo: {matchId, slot} où le vainqueur atterrit au tour suivant
// feedsToConsolante: {matchId, slot} où le PERDANT (tour 1 principal uniquement) atterrit
const TOPOLOGY = {
  'P1-1':{round:1,bracket:'principal',feedsTo:{m:'P2-1',slot:'A'},feedsConso:{m:'C1-1',slot:'A'}},
  'P1-2':{round:1,bracket:'principal',feedsTo:{m:'P2-1',slot:'B'},feedsConso:{m:'C1-1',slot:'B'}},
  'P1-3':{round:1,bracket:'principal',feedsTo:{m:'P2-2',slot:'A'},feedsConso:{m:'C1-2',slot:'A'}},
  'P1-4':{round:1,bracket:'principal',feedsTo:{m:'P2-2',slot:'B'},feedsConso:{m:'C1-2',slot:'B'}},
  'P1-5':{round:1,bracket:'principal',feedsTo:{m:'P2-3',slot:'A'},feedsConso:{m:'C1-3',slot:'A'}},
  'P1-6':{round:1,bracket:'principal',feedsTo:{m:'P2-3',slot:'B'},feedsConso:{m:'C1-3',slot:'B'}},
  'P1-7':{round:1,bracket:'principal',feedsTo:{m:'P2-4',slot:'A'},feedsConso:{m:'C1-4',slot:'A'}},
  'P1-8':{round:1,bracket:'principal',feedsTo:{m:'P2-4',slot:'B'},feedsConso:{m:'C1-4',slot:'B'}},

  'P2-1':{round:2,bracket:'principal',feedsTo:{m:'P3-1',slot:'A'}},
  'P2-2':{round:2,bracket:'principal',feedsTo:{m:'P3-1',slot:'B'}},
  'P2-3':{round:2,bracket:'principal',feedsTo:{m:'P3-2',slot:'A'}},
  'P2-4':{round:2,bracket:'principal',feedsTo:{m:'P3-2',slot:'B'}},

  'P3-1':{round:3,bracket:'principal',feedsTo:{m:'P4-1',slot:'A'}},
  'P3-2':{round:3,bracket:'principal',feedsTo:{m:'P4-1',slot:'B'}},

  'P4-1':{round:4,bracket:'principal',feedsTo:null},

  // Consolante : 4 matchs UNIQUES, pas un tableau.
  // Chaque perdant du 1er tour joue exactement une partie, puis un classement
  // départage les 8 équipes. feedsTo est donc null partout : rien ne se propage.
  'C1-1':{round:1,bracket:'consolante',feedsTo:null},
  'C1-2':{round:1,bracket:'consolante',feedsTo:null},
  'C1-3':{round:1,bracket:'consolante',feedsTo:null},
  'C1-4':{round:1,bracket:'consolante',feedsTo:null},
};
const ROUND_LABELS = {
  // 16 équipes = 8 matchs au premier tour = 8es de finale.
  // Les 16es supposeraient 32 équipes.
  principal:{1:'8es de finale',2:'Quarts de finale',3:'Demi-finales',4:'Finale'},
  consolante:{1:'Matchs de consolante'}
};
const ALL_MATCH_IDS = Object.keys(TOPOLOGY);

let equipes = [];
let matches = {}; // id -> state
let currentTab = 'principal';
let pollTimer = null;

const $ = s => document.querySelector(s);

// ---------- Bootstrap ----------
// CORRECTION CRITIQUE.
// L'ancienne version faisait : try { lire } catch { eq = null } puis
// if(!eq) { réinitialiser les 24 matchs }.
// Conséquence : la moindre coupure réseau au chargement était interprétée comme
// "la base est vide", et le téléphone réinitialisait le tournoi POUR TOUT LE MONDE.
// Sur un terrain en 4G instable, c'était une question de temps.
//
// Ici on distingue strictement les deux cas :
//   - lecture en échec        -> on remonte l'erreur, on ne touche à RIEN
//   - lecture réussie et vide -> et seulement là, on initialise
async function ensureInit(){
  const all = await kvGetAll();          // volontairement PAS de try/catch :
                                          // une erreur doit remonter à init(), pas être avalée
  const eq = all[KEY_EQUIPES];

  if(Array.isArray(eq) && eq.length === 16){
    equipes = eq;
    hydrate(all);
    return;
  }

  // Second garde-fou : si des matchs existent déjà, la base n'est pas vierge.
  // On refuse d'initialiser même si la clé équipes est absente ou corrompue —
  // mieux vaut un affichage incomplet qu'un tournoi effacé.
  const matchsExistants = ALL_MATCH_IDS.some(id => all[KEY_MATCH_PREFIX+id]);
  if(matchsExistants){
    equipes = Array.isArray(eq) ? eq : Array.from({length:16}, (_,i)=>`Équipe ${i+1}`);
    hydrate(all);
    return;
  }

  // Base réellement vierge : premier lancement.
  equipes = Array.from({length:16}, (_,i)=>`Équipe ${i+1}`);
  await seedMatches(equipes);
}

// Appariements du 1er tour : 1 contre 16, 2 contre 15, 3 contre 14...
// Une seule définition, réutilisée par seedMatches ET saveTeams — pour que
// renommer les équipes ne puisse jamais produire un appariement différent
// de celui du tirage initial.
function appariements(eq){
  const pairs = [];
  for(let i=0;i<8;i++) pairs.push([eq[i], eq[15-i]]);
  return pairs;
}

async function seedMatches(eq){
  const pairs = appariements(eq);
  const seeds = {
    'P1-1':pairs[0],'P1-2':pairs[1],'P1-3':pairs[2],'P1-4':pairs[3],
    'P1-5':pairs[4],'P1-6':pairs[5],'P1-7':pairs[6],'P1-8':pairs[7],
  };
  const entries = [[KEY_EQUIPES, eq], [KEY_TERRAINS, terrains]];
  for(const id of ALL_MATCH_IDS){
    const seed = seeds[id];
    entries.push([KEY_MATCH_PREFIX+id, {
      id,
      teamA: seed ? seed[0] : null,
      teamB: seed ? seed[1] : null,
      subA: null, subB: null,
      status: seed ? 'a_jouer' : 'attente',
      winner: null,
      orga: null
    }]);
  }
  // 1 requête au lieu de 25.
  await kvSetMany(entries);
}

// Remplit l'état local à partir d'un instantané complet de la table.
function hydrate(all){
  for(const id of ALL_MATCH_IDS){
    const s = all[KEY_MATCH_PREFIX+id];
    if(s) matches[id] = s;
  }
  // Les terrains réaffectés par l'organisateur écrasent les valeurs par défaut.
  // On repart de la table par défaut à chaque fois pour qu'un match absent de
  // l'enregistrement conserve son terrain d'origine plutôt que de disparaître.
  if(all[KEY_TERRAINS] && typeof all[KEY_TERRAINS] === 'object'){
    terrains = Object.assign({}, TERRAINS_DEFAUT, all[KEY_TERRAINS]);
  }
}

// readMatch NE SWALLOW PLUS l'erreur. Avant, une panne réseau et un match
// réellement absent étaient tous deux traduits par `null` — indiscernables
// pour l'appelant, qui bailait immédiatement ("Match introuvable") au lieu de
// réessayer. Or un match ne disparaît jamais (les 19 sont créés à l'init) :
// ce "null" n'était donc, en pratique, presque toujours une panne réseau
// maquillée en erreur définitive. Désormais l'exception remonte, et c'est
// l'appelant qui décide s'il réessaie.
async function readMatch(id){
  return await kvGet(KEY_MATCH_PREFIX+id);
}
async function writeMatch(id, state){
  return kvSet(KEY_MATCH_PREFIX+id, state);
}

// ---------- Poll / render ----------
async function pollAll(){
  try{
    const all = await kvGetAll();          // 1 requête pour les 24 matchs + les équipes
    hydrate(all);
    const eq = all[KEY_EQUIPES];
    if(Array.isArray(eq)) equipes = eq;
    hideFatal();
    setSync(true, 'synchro OK — ' + new Date().toLocaleTimeString('fr-FR'));
    render();
    // Le réseau vient de prouver qu'il répond : c'est le meilleur moment pour
    // vider la file d'attente, pas la peine d'attendre l'événement 'online'
    // du navigateur qui ne se déclenche pas toujours de façon fiable.
    traiterFileAttente();
  }catch(e){
    // On signale la panne sans jamais toucher aux données locales ni distantes :
    // l'affichage reste sur le dernier état connu, la prochaine passe rattrapera.
    setSync(false, 'hors ligne — nouvelle tentative dans 5 s');
  }
}

function setSync(ok, txt){
  $('#syncTxt').textContent = txt;
  $('#syncBar .dot').style.color = ok ? '#4f9d69' : '#c1622f';
}

// Bandeau d'erreur visible à l'écran. Sans lui, une panne se traduit par un
// écran figé et il faut ouvrir la console du navigateur pour comprendre —
// impossible à demander à quelqu'un en plein tournoi.
function showFatal(msg){
  let el = document.getElementById('fatalBox');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatalBox';
    el.style.cssText = 'background:rgba(227,49,52,0.14);border:1px solid rgba(227,49,52,0.5);'
      + 'color:#f0a08a;font-size:12.5px;padding:12px 14px;border-radius:10px;margin-bottom:16px;'
      + 'line-height:1.45;word-break:break-word;';
    document.querySelector('main').prepend(el);
  }
  el.textContent = msg;
}
function hideFatal(){
  const el = document.getElementById('fatalBox');
  if(el) el.remove();
}

function statusBadge(m){
  if(!m.teamA || !m.teamB) return {cls:'attente', label:'En attente des équipes'};
  if(m.status === 'termine') return {cls:'termine', label:'Terminé'};
  if(m.status === 'litige') return {cls:'litige', label:'Litige — organisateur'};
  if(m.subA || m.subB) return {cls:'partiel', label:'1 saisie reçue — en attente de l\'autre'};
  return {cls:'jouer', label:'À jouer'};
}

function matchCard(m){
  const b = statusBadge(m);
  const clickable = m.teamA && m.teamB && m.status !== 'termine';
  const winnerIsA = m.status==='termine' && m.winner==='A';
  const winnerIsB = m.status==='termine' && m.winner==='B';
  // Garde : un match tranché par l'organisateur peut être "terminé" sans saisie A.
  // L'ancienne version lisait m.subA.scoreA sans vérifier et plantait l'affichage
  // de TOUT le tableau (une exception dans matchCard interrompt renderPublic).
  const src = m.orga || m.subA || m.subB || null;
  const scoreA = (m.status==='termine' && src) ? src.scoreA : '';
  const scoreB = (m.status==='termine' && src) ? src.scoreB : '';
  return `
  <div class="match ${m.status==='termine'?'termine':''} ${m.status==='litige'?'litige':''} ${(!m.teamA||!m.teamB)?'attente':''}" ${clickable?`onclick="openMatch('${m.id}')"`:''}>
    <div class="match-row">
      <span class="team-name ${winnerIsA?'winner':''}">${esc(m.teamA) || '—'}</span>
      <span class="team-score ${winnerIsA?'winner':''}">${scoreA}</span>
    </div>
    <div class="vs-mini">vs</div>
    <div class="match-row">
      <span class="team-name ${winnerIsB?'winner':''}">${esc(m.teamB) || '—'}</span>
      <span class="team-score ${winnerIsB?'winner':''}">${scoreB}</span>
    </div>
    <div class="badge-row">
      <span class="badge terrain">Terrain ${terrains[m.id] || '?'}</span>
      <span class="badge ${b.cls}">${b.label}</span>
    </div>
  </div>`;
}

function render(){
  renderPublic();
  if(IS_ADMIN) renderAdmin();
}

function renderPublic(){
  const rounds = currentTab === 'principal' ? [1,2,3,4] : [1];
  let html = '';
  for(const r of rounds){
    const ids = ALL_MATCH_IDS.filter(id => TOPOLOGY[id].bracket===currentTab && TOPOLOGY[id].round===r);
    if(!ids.length) continue;
    const vague = currentTab === 'principal' ? r : r + 1;
    html += `<div class="round-title"><img class="rnum" src="round-${r}.png" alt="">${ROUND_LABELS[currentTab][r]}`
          + `<span style="color:var(--text-faint);font-weight:600;letter-spacing:0.06em;"> · Vague ${vague}</span>`
          + `</div><div class="matches-col">`;
    for(const id of ids){
      const m = matches[id];
      if(m) html += matchCard(m);
    }
    html += '</div>';
  }
  // Le classement n'a de sens que dans la consolante : c'est son résultat final,
  // puisqu'il n'y a plus de tour suivant vers lequel se propager.
  if(currentTab === 'consolante') html += renderClassement();
  $('#publicView').innerHTML = html;
}

// ---------- Modal saisie score ----------

    <div class="sub">Saisis le score final du match. Le match passe à "Terminé" quand les deux équipes ont saisi le même résultat.</div>
    ${(m.subA || m.subB) ? renderSubmissionsView(m) : ''}
    <div class="field">
      <label>Qui saisit ce score ?</label>
      <select id="whoAmI">
        <option value="A">${esc(m.teamA)}</option>

      </select>
    </div>

      <div class="field">
        <label>Score ${esc(m.teamA)}</label>
        <input type="number" id="scoreA" min="0" inputmode="numeric">

function renderSubmissionsView(m){
  let rows = '';
  if(m.subA) rows += `<div class="sub-row"><span class="who">${esc(m.teamA)} a saisi</span><span>${m.subA.scoreA} – ${m.subA.scoreB}${m.subA.tie?(', tir décisif: '+(m.subA.tie==='A'?esc(m.teamA):esc(m.teamB))):''}</span></div>`;
  if(m.subB) rows += `<div class="sub-row"><span class="who">${esc(m.teamB)} a saisi</span><span>${m.subB.scoreA} – ${m.subB.scoreB}${m.subB.tie?(', tir décisif: '+(m.subB.tie==='A'?esc(m.teamA):esc(m.teamB))):''}</span></div>`;
  const litigeNote = m.status==='litige' ? `<div class="tie-note" style="color:#e8956a;background:rgba(193,98,47,0.12);">Les deux saisies ne correspondent pas. Un organisateur tranchera — tu peux resaisir si tu t'es trompé.</div>` : '';
  return `<div class="submissions-view">${rows}</div>${litigeNote}`;
}

function checkTie(m){
  const a = parseInt($('#scoreA').value), b = parseInt($('#scoreB').value);
  const zone = $('#tieZone');
  if(!isNaN(a) && !isNaN(b) && a===b){
    zone.innerHTML = `
      <div class="tie-note">Scores égaux au coup de sifflet : qui a gagné le tir décisif ?</div>
      <div class="field">
        <select id="tieWinner">
          <option value="A">${esc(m.teamA)}</option>
          <option value="B">${esc(m.teamB)}</option>
        </select>
      </div>`;
  } else {
    zone.innerHTML = '';
  }
}

// Tentative d'écriture d'un score, SANS AUCUN ACCÈS AU DOM.
// Extraite de submitScore pour être appelable depuis deux endroits : la saisie
// interactive (l'écran de saisie est ouvert), et le renvoi automatique en
// arrière-plan (traiterFileAttente), qui peut s'exécuter alors que la personne
// a fermé l'écran, verrouillé son téléphone, ou changé d'onglet.
//
// Retourne :
//   {ok:true}                                  — écrit et vérifié
//   {ok:false, definitif:true,  raison}         — inutile de réessayer (déjà
//                                                 validé, ou même appareil des
//                                                 deux côtés)
//   {ok:false, definitif:false, raison}         — panne réseau persistante :
//                                                 à retenter plus tard, jamais
//                                                 à abandonner
async function tenterEcritureScore(id, who, sub){
  const champ = (who === 'A') ? 'subA' : 'subB';
  for(let tentative = 1; tentative <= 4; tentative++){
    let fresh;
    try{
      fresh = await readMatch(id);
    }catch(e){
      // Panne réseau à la lecture : ce n'est PAS "match introuvable" (les 19
      // matchs existent toujours, seedés à l'init). On retente.
      await new Promise(r => setTimeout(r, 250 + Math.random()*350));
      continue;
    }
    if(!fresh) return {ok:false, definitif:true, raison:'Match introuvable.'};
    if(fresh.status === 'termine'){
      return {ok:false, definitif:true, raison:'Ce match a déjà été validé. Vois avec l\'organisateur.'};
    }

    // La double confirmation n'a de sens que si les deux saisies viennent de
    // deux téléphones différents. Sans ce contrôle, une personne saisit pour
    // son équipe, rouvre le match, saisit pour l'adversaire, et valide seule —
    // le désaccord ne peut alors jamais se déclencher.
    // L'organisateur est exempté : il doit pouvoir dérouler sa démonstration
    // depuis un seul appareil.
    const autre = (who === 'A') ? 'subB' : 'subA';
    if(!IS_ADMIN && fresh[autre] && fresh[autre].dev === DEVICE){
      return {ok:false, definitif:true,
        raison:"Cet appareil a déjà saisi pour l'autre équipe. La seconde saisie doit "
             + "venir du téléphone de l'équipe adverse. Si elle ne peut pas saisir, "
             + "l'organisateur peut valider le match."};
    }

    fresh[champ] = sub;
    if(fresh.subA && fresh.subB){
      const concordent = fresh.subA.scoreA===fresh.subB.scoreA &&
                         fresh.subA.scoreB===fresh.subB.scoreB &&
                         fresh.subA.tie===fresh.subB.tie;
      if(concordent){
        fresh.status = 'termine';
        fresh.winner = fresh.subA.tie ? fresh.subA.tie
                     : (fresh.subA.scoreA > fresh.subA.scoreB ? 'A' : 'B');
      } else {
        fresh.status = 'litige';
      }
    }

    try{
      await writeMatch(id, fresh);
    }catch(e){
      await new Promise(r => setTimeout(r, 250 + Math.random()*350));
      continue;
    }

    let verif;
    try{ verif = await readMatch(id); }catch(e){ verif = null; }
    if(verif && verif[champ] && verif[champ].dev === DEVICE
       && verif[champ].scoreA === sub.scoreA && verif[champ].scoreB === sub.scoreB){
      if(verif.status === 'termine' && verif.winner) await propagate(id, verif);
      matches[id] = verif;
      return {ok:true};
    }
    await new Promise(r => setTimeout(r, 250 + Math.random()*350));
  }
  return {ok:false, definitif:false, raison:'Réseau trop instable pour confirmer l\'envoi.'};
}

// ---------- File d'attente locale ----------
// Filet de sécurité pour une coupure PROLONGÉE (au-delà des 4 tentatives déjà
// intégrées à tenterEcritureScore, qui couvrent les accrocs de quelques
// secondes). Si le réseau manque plusieurs minutes, la saisie n'est jamais
// perdue : elle est gardée sur CE téléphone et renvoyée automatiquement dès
// que la connexion revient — même si la personne a fermé l'écran entre-temps.
//
// Ce n'est pas un mode hors-ligne : le tableau affiché reste celui de la
// dernière synchro réussie, jamais un état reconstitué localement. Seule la
// saisie sortante est mise en attente, jamais la lecture.
const CLE_FILE = 'petanque-file-attente';

function litFile(){
  try{ return JSON.parse(localStorage.getItem(CLE_FILE) || '[]'); }
  catch(e){ return []; }
}
function ecritFile(file){
  try{ localStorage.setItem(CLE_FILE, JSON.stringify(file)); }catch(e){ /* stockage indisponible : tant pis, pas de file */ }
}

// Une seule entrée par match+équipe : une nouvelle saisie remplace l'ancienne
// plutôt que de s'empiler à côté (la personne a pu corriger un score avant que
// le premier envoi n'ait eu le temps de partir).
function enqueueSaisie(id, who, sub){
  const file = litFile().filter(e => !(e.id === id && e.who === who));
  file.push({id, who, sub, ajoute: Date.now()});
  ecritFile(file);
  majBandeauFile();
}

function retirerDeFile(id, who){
  ecritFile(litFile().filter(e => !(e.id === id && e.who === who)));
  majBandeauFile();
}

let traitementEnCours = false;
async function traiterFileAttente(){
  if(traitementEnCours) return;   // jamais deux vidages en parallèle
  const file = litFile();
  if(!file.length) return;
  traitementEnCours = true;
  try{
    for(const entree of file){
      const r = await tenterEcritureScore(entree.id, entree.who, entree.sub);
      if(r.ok){
        retirerDeFile(entree.id, entree.who);
      } else if(r.definitif){
        // Le match a changé de statut entre-temps (déjà validé, ou conflit
        // d'appareil) : renvoyer indéfiniment n'aboutirait jamais. On retire
        // de la file et on prévient — la personne doit rouvrir le match.
        retirerDeFile(entree.id, entree.who);
        alert(`Une saisie en attente n'a pas pu être envoyée : ${r.raison}\n\nVérifie ce match.`);
      }
      // Sinon (échec non définitif) : reste en file, prochain passage.
    }
    render();
  } finally {
    traitementEnCours = false;
  }
}

function majBandeauFile(){
  const n = litFile().length;
  let el = document.getElementById('bandeauFile');
  if(n === 0){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement('div');
    el.id = 'bandeauFile';
    el.style.cssText = 'position:sticky;top:0;z-index:25;background:#d9a54a;color:#20140a;'
      + 'font-size:12.5px;font-weight:600;padding:9px 14px;text-align:center;'
      + 'display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;';
    document.body.prepend(el);
  }
  el.innerHTML = `⏳ ${n} saisie${n>1?'s':''} en attente d'envoi — réessai automatique`
    + `<button onclick="traiterFileAttente()" style="background:#20140a;color:#f9c24d;border:none;`
    + `border-radius:6px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;">Réessayer maintenant</button>`;
}

// Renvoi automatique : dès que le navigateur détecte une reconnexion, dès
// qu'on revient sur l'onglet, et à chaque cycle de synchro (toutes les 5 s) —
// pour ne jamais dépendre d'un geste de la personne pour récupérer sa saisie.
window.addEventListener('online', traiterFileAttente);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') traiterFileAttente();
});

async function submitScore(id){
  const who = $('#whoAmI').value;
  const scoreA = parseInt($('#scoreA').value);
  const scoreB = parseInt($('#scoreB').value);
  const errEl = $('#submitErr');
  if(isNaN(scoreA) || isNaN(scoreB)){
    errEl.textContent = 'Renseigne les deux scores.';
    return;
  }
  if(scoreA < 0 || scoreB < 0 || scoreA > 13 || scoreB > 13){
    errEl.textContent = 'Un score de pétanque va de 0 à 13.';
    return;
  }
  let tie = null;
  if(scoreA === scoreB){
    const tieEl = $('#tieWinner');
    if(!tieEl){ errEl.textContent = 'Indique qui a gagné le tir décisif.'; return; }
    tie = tieEl.value;
  }
  errEl.textContent = '';
  const sub = {scoreA, scoreB, tie, dev:DEVICE, t:new Date().toLocaleTimeString('fr-FR')};

  let r;
  try{
    r = await tenterEcritureScore(id, who, sub);
  }catch(e){
    // Exception non anticipée (ex. coupure totale au tout premier appel) :
    // traitée exactement comme un échec non définitif, jamais comme un échec
    // sec qui obligerait à tout retaper.
    console.error('[submitScore]', e);
    r = {ok:false, definitif:false, raison:'Réseau indisponible.'};
  }

  if(r.ok){
    closeSheet();
    render();
    return;
  }
  if(r.definitif){
    errEl.textContent = r.raison;
    if(r.raison.includes('déjà été validé')) await pollAll();
    return;
  }
  // Échec non définitif après 4 tentatives rapides : plutôt que de laisser la
  // personne avec un score à retaper, on le garde sur ce téléphone et on
  // continuera d'essayer tout seul.
  enqueueSaisie(id, who, sub);
  closeSheet();
  render();
}

// Écrit UNE équipe dans UN emplacement d'un match, en vérifiant que l'écriture
// a tenu. Indispensable : deux matchs différents alimentent le même match
// suivant (P1-1 en A, P1-2 en B). S'ils se terminent au même moment — ce qui est
// la norme en parties au temps, tout le monde s'arrête au coup de sifflet — les
// deux lisent un match cible vide, et le second écrasait le premier.
// Le vainqueur disparaissait alors du tour suivant.
async function ecrireEmplacement(matchId, slot, nom){
  const champ = slot === 'A' ? 'teamA' : 'teamB';
  for(let tentative = 1; tentative <= 5; tentative++){
    let cible;
    try{
      cible = await readMatch(matchId);
    }catch(e){
      // AVANT : une lecture ratée à la 1re tentative faisait `return false`
      // immédiatement — les 4 tentatives restantes n'étaient jamais utilisées.
      // Une panne réseau d'une seconde suffisait à perdre la propagation.
      // Maintenant, une lecture ratée est traitée comme une écriture ratée :
      // on attend, et on retente.
      await new Promise(r => setTimeout(r, 200 + Math.random()*400));
      continue;
    }
    if(!cible) continue;   // ne devrait jamais arriver (les matchs sont tous seedés), garde défensive
    cible[champ] = nom;
    if(cible.teamA && cible.teamB && cible.status === 'attente') cible.status = 'a_jouer';
    try{
      await writeMatch(matchId, cible);
    }catch(e){
      await new Promise(r => setTimeout(r, 200 + Math.random()*400));
      continue;
    }

    let verif;
    try{ verif = await readMatch(matchId); }catch(e){ verif = null; }
    if(verif && verif[champ] === nom) return true;
    await new Promise(r => setTimeout(r, 200 + Math.random()*400));
  }
  console.error('[propagate] impossible d\'inscrire', nom, 'dans', matchId, slot);
  return false;
}

async function propagate(id, resolved){
  const topo = TOPOLOGY[id];
  const winnerName = resolved.winner==='A' ? resolved.teamA : resolved.teamB;
  const loserName  = resolved.winner==='A' ? resolved.teamB : resolved.teamA;

  if(topo.feedsTo)    await ecrireEmplacement(topo.feedsTo.m,    topo.feedsTo.slot,    winnerName);
  if(topo.feedsConso) await ecrireEmplacement(topo.feedsConso.m, topo.feedsConso.slot, loserName);
}

// Filet de sécurité, indépendant de la cause.
// Une propagation peut échouer pour d'autres raisons qu'une collision : coupure
// réseau au mauvais moment, téléphone verrouillé pendant l'écriture. Plutôt que
// d'essayer de prévoir chaque cas, on VÉRIFIE le résultat : tout match terminé
// dont le vainqueur n'apparaît pas au tour suivant est signalé à l'organisateur.
function incoherences(){
  const out = [];
  for(const id of ALL_MATCH_IDS){
    const m = matches[id];
    if(!m || m.status !== 'termine' || !m.winner) continue;
    const topo = TOPOLOGY[id];
    const vainqueur = m.winner==='A' ? m.teamA : m.teamB;
    const perdant   = m.winner==='A' ? m.teamB : m.teamA;
    for(const [lien, nom, quoi] of [[topo.feedsTo, vainqueur, 'vainqueur'],
                                    [topo.feedsConso, perdant, 'perdant']]){
      if(!lien) continue;
      const cible = matches[lien.m];
      if(!cible) continue;
      const actuel = lien.slot === 'A' ? cible.teamA : cible.teamB;
      if(actuel !== nom){
        out.push({id, lien, nom, quoi, match:m, cible});
      }
    }
  }
  return out;
}

async function reparerTableau(){
  if(!IS_ADMIN) return;
  const pbs = incoherences();
  if(!pbs.length){ alert('Aucune incohérence détectée.'); return; }
  const detail = pbs.map(p => `• ${p.nom} (${p.quoi} de ${p.match.teamA} vs ${p.match.teamB}) → ${p.lien.m}`).join('\n');
  if(!confirm(`${pbs.length} équipe(s) manquante(s) au tour suivant :\n\n${detail}\n\nLes replacer ?`)) return;
  try{
    for(const p of pbs) await ecrireEmplacement(p.lien.m, p.lien.slot, p.nom);
    await pollAll();
    const reste = incoherences().length;
    alert(reste ? `${reste} incohérence(s) subsistent — réessaie.` : 'Tableau réparé.');
  }catch(e){
    console.error('[reparerTableau]', e);
    alert('Réparation impossible — vérifie le réseau.');
  }
}

function closeSheet(){ $('#overlay').classList.remove('open'); }

// ---------- Admin ----------
// ---------- Retour en arrière (organisateur uniquement) ----------
//
// Pourquoi une CASCADE et pas une simple annulation du match ciblé :
// quand un match se termine, son vainqueur est recopié dans le match suivant et
// son perdant dans la consolante. Annuler le match sans défaire ces recopies
// laisserait une équipe qualifiée pour un tour qu'elle n'a pas gagné — un tableau
// incohérent, impossible à rattraper en pleine journée.
// On remet donc à zéro le match ciblé ET tout ce qui en découle.

function etatVierge(m){
  m.subA = null; m.subB = null; m.winner = null; m.orga = null;
  m.status = (m.teamA && m.teamB) ? 'a_jouer' : 'attente';
  return m;
}

// Construit la liste des écritures nécessaires pour annuler `id` et sa descendance.
function collecterAnnulation(id, all, acc, slotAEffacer){
  const cle = KEY_MATCH_PREFIX + id;
  const m = all[cle];
  if(!m) return acc;
  // Un match n'est traité qu'une fois : les branches principal et consolante
  // ne se rejoignent jamais, mais la garde évite un doublon dans l'upsert
  // (PostgreSQL refuse deux fois la même clé dans un seul lot).
  if(acc.vus.has(id)) return acc;
  acc.vus.add(id);

  // Pour les matchs en aval, on retire l'équipe qui venait du match annulé.
  if(slotAEffacer) m[slotAEffacer === 'A' ? 'teamA' : 'teamB'] = null;
  etatVierge(m);
  acc.entries.push([cle, m]);

  const topo = TOPOLOGY[id];
  if(topo.feedsTo)    collecterAnnulation(topo.feedsTo.m, all, acc, topo.feedsTo.slot);
  if(topo.feedsConso) collecterAnnulation(topo.feedsConso.m, all, acc, topo.feedsConso.slot);
  return acc;
}

async function annulerMatch(id){
  if(!IS_ADMIN) return;
  const m = matches[id];
  if(!m) return;

  // On annonce précisément ce qui va être effacé avant de demander confirmation.
  const all = await kvGetAll();
  const acc = collecterAnnulation(id, all, {entries:[], vus:new Set()}, null);
  const enAval = acc.entries.length - 1;
  const txt = `Annuler ${m.teamA || '?'} vs ${m.teamB || '?'} ?\n\n`
    + `Le score sera effacé et le match repassera « à jouer ».`
    + (enAval > 0 ? `\n\n${enAval} match(s) en aval seront également remis à zéro `
                    + `(le vainqueur sera retiré du tour suivant, le perdant de la consolante).` : '');
  if(!confirm(txt)) return;

  try{
    await kvSetMany(acc.entries);
    await pollAll();
  }catch(e){
    console.error('[annulerMatch]', e);
    alert("Annulation impossible — vérifie le réseau. Rien n'a été modifié.");
  }
}

async function toutReinitialiser(){
  if(!IS_ADMIN) return;

// Classement de la consolante.
// Règle retenue : victoire d'abord, puis points marqués.
// C'est le classement le plus intuitif à annoncer au micro — on ne se retrouve
// jamais à expliquer qu'une équipe battue 13-12 devance une équipe qui a gagné.
// Départage en cascade : victoire > points marqués > points encaissés (le moins
// possible) > ordre alphabétique, pour qu'aucune égalité ne reste non tranchée.
function classementConsolante(){
  const lignes = [];
  for(const id of ALL_MATCH_IDS){
    if(TOPOLOGY[id].bracket !== 'consolante') continue;
    const m = matches[id];
    if(!m || !m.teamA || !m.teamB) continue;
    const src = m.orga || (m.subA && m.subB ? m.subA : (m.subA || m.subB));
    // Le double ! force un vrai booléen. Sans lui, `joue` valait l'OBJET score,
    // et le tri comparait deux références d'objets distinctes — donc toujours
    // "différentes" — ce qui court-circuitait tous les critères suivants.
    const joue = !!(m.status === 'termine' && src);
    for(const cote of ['A','B']){
      const nom = cote === 'A' ? m.teamA : m.teamB;
      lignes.push({
        nom,
        joue,
        victoire: joue && m.winner === cote ? 1 : 0,
        marques:  joue ? (cote === 'A' ? src.scoreA : src.scoreB) : null,
        encaisses:joue ? (cote === 'A' ? src.scoreB : src.scoreA) : null,
        match: id
      });
    }
  }
  // Les équipes dont le match n'est pas terminé sont rejetées en fin de
  // classement : les afficher avec 0 point laisserait croire à une défaite.
  lignes.sort((a,b) => {
    if(a.joue !== b.joue) return a.joue ? -1 : 1;
    if(!a.joue) return a.nom.localeCompare(b.nom,'fr');
    if(b.victoire !== a.victoire) return b.victoire - a.victoire;
    if(b.marques  !== a.marques)  return b.marques - a.marques;
    if(a.encaisses!== b.encaisses)return a.encaisses - b.encaisses;
    return a.nom.localeCompare(b.nom,'fr');
  });
  return lignes;
}

function renderClassement(){
  const l = classementConsolante();
  if(!l.length) return '';
  const joues = l.filter(x => x.joue).length;
  let html = `<div class="round-title">Classement · ${joues}/${l.length} équipes classées</div>
    <div class="matches-col" style="padding:4px 0;">`;
  l.forEach((x, i) => {
    const rang = x.joue ? `${i+1}` : '–';
    const detail = x.joue
      ? `<span style="color:${x.victoire?'#7bc491':'var(--text-faint)'};font-size:11.5px;">${x.victoire?'V':'D'}</span>
         <span style="font-variant-numeric:tabular-nums;font-weight:700;color:var(--sable-soft);min-width:26px;text-align:right;">${x.marques}</span>
         <span style="color:var(--text-faint);font-size:11.5px;font-variant-numeric:tabular-nums;">/ ${x.encaisses}</span>`
      : `<span style="color:var(--text-faint);font-size:11.5px;">match en cours</span>`;
    html += `<div style="display:flex;align-items:center;gap:10px;padding:10px 13px;
        border-top:${i?'1px solid rgba(58,87,124,0.55)':'none'};
        ${i===0 && x.joue ? 'background:rgba(249,194,77,0.07);' : ''}">
      <span style="flex:0 0 22px;color:${i===0&&x.joue?'var(--sable-soft)':'var(--text-faint)'};
        font-weight:700;font-variant-numeric:tabular-nums;">${rang}</span>
      <span style="flex:1;min-width:0;font-size:13.5px;${i===0&&x.joue?'font-weight:700;color:var(--sable-soft);':''}">${esc(x.nom)}</span>
      ${detail}
    </div>`;
  });
  html += `</div><div class="empty" style="margin-top:8px;font-size:11.5px;">
    Victoire d'abord, puis points marqués. La colonne de droite indique points marqués / encaissés.</div>`;
  return html;
}

// CORRECTION DU BUG DE SAISIE DES NOMS D'ÉQUIPE.
// renderAdmin reconstruit tout le HTML de la vue organisateur. Comme pollAll()
// appelle render() toutes les 5 secondes, les champs étaient recréés à partir
// des valeurs enregistrées en base : la saisie en cours était effacée et le nom
// revenait à "Équipe N". On avait littéralement 5 secondes pour taper un nom.
//
// Parade : on relève les valeurs saisies et la position du curseur AVANT de
// reconstruire, on les remet APRÈS. La reconstruction reste nécessaire (litiges,
// terrains et incohérences doivent rester à jour), mais elle devient invisible
// pour qui est en train de taper.
function releverSaisies(){
  const etat = {valeurs:{}, actif:null, debut:0, fin:0};
  for(const i of document.querySelectorAll('#adminView input[data-idx], #adminView input[data-match]')){
    const cle = (i.dataset.idx !== undefined) ? 'e'+i.dataset.idx : 't'+i.dataset.match;
    etat.valeurs[cle] = i.value;
    if(document.activeElement === i){
      etat.actif = cle;
      try{ etat.debut = i.selectionStart; etat.fin = i.selectionEnd; }catch(e){}
    }
  }
  return etat;
}

function restaurerSaisies(etat){
  for(const i of document.querySelectorAll('#adminView input[data-idx], #adminView input[data-match]')){
    const cle = (i.dataset.idx !== undefined) ? 'e'+i.dataset.idx : 't'+i.dataset.match;
    if(etat.valeurs[cle] !== undefined) i.value = etat.valeurs[cle];
    if(etat.actif === cle){
      i.focus();
      // Le curseur est remis exactement où il était : sinon il saute en fin de
      // champ à chaque rafraîchissement et corriger une lettre devient pénible.
      try{ i.setSelectionRange(etat.debut, etat.fin); }catch(e){}
    }
  }
}

function renderAdmin(){
  const saisiesEnCours = releverSaisies();
  // Deux situations demandent un arbitrage :
  //  - litige : les deux équipes ont saisi des résultats différents
  //  - bloqué : une seule équipe a saisi et l'autre ne peut pas (téléphone à
  //    plat, pas de réseau, équipe partie). Depuis que la saisie depuis un même
  //    appareil pour les deux équipes est refusée, c'est la seule issue.
  const litigeIds = ALL_MATCH_IDS.filter(id => matches[id] && matches[id].status==='litige');
  const bloqueIds = ALL_MATCH_IDS.filter(id => {
    const m = matches[id];
    return m && m.status !== 'termine' && m.status !== 'litige'
             && ((m.subA && !m.subB) || (m.subB && !m.subA));
  });
  let html = `<div class="admin-banner">Mode organisateur — cette vue n'est pas destinée aux équipes</div>`;

      <div class="empty" style="margin-bottom:10px;">Des équipes qualifiées n'apparaissent pas au tour suivant — propagation interrompue.</div>`;
    for(const p of pbs){
      html += `<div style="font-size:12.5px;margin-bottom:6px;color:var(--text-dim);">
        • <span style="color:#f7f5f0;">${esc(p.nom)}</span> (${p.quoi} de ${esc(p.match.teamA)} vs ${esc(p.match.teamB)})
        manque en ${p.lien.m}</div>`;
    }
    html += `<button class="primary" style="width:100%;margin-top:8px;" onclick="reparerTableau()">Réparer le tableau</button></div>`;
  }

  html += `<div class="admin-section"><h3>Litiges en cours (${litigeIds.length})</h3>`;
  if(!litigeIds.length){
    html += `<div class="empty">Aucun litige pour l'instant.</div>`;
  } else {
    for(const id of litigeIds){
      const m = matches[id];
      // Champs de score : l'organisateur saisit le résultat réel, pas seulement
      // le vainqueur. Prérenseignés avec la saisie de l'équipe A pour éviter de
      // tout retaper quand le désaccord ne porte que sur un point.
      const pre = m.subA || m.subB || {scoreA:'', scoreB:''};
      html += `<div class="litige-card">
        <div style="font-weight:600;margin-bottom:8px;">${esc(m.teamA)} vs ${esc(m.teamB)}</div>
        ${renderSubmissionsView(m)}
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(58,87,124,0.55);">
          <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:8px;">Score retenu :</div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="flex:1;min-width:0;font-size:13px;">${esc(m.teamA)}</span>
            <input type="number" id="arbA-${id}" min="0" max="13" value="${pre.scoreA}"
              style="width:64px;flex:0 0 auto;text-align:center;">

            <span style="flex:1;min-width:0;font-size:13px;">${esc(m.teamB)}</span>
            <input type="number" id="arbB-${id}" min="0" max="13" value="${pre.scoreB}"
              style="width:64px;flex:0 0 auto;text-align:center;">

            <select id="arbTie-${id}" style="width:100%;">

              <option value="B">${esc(m.teamB)}</option>
            </select>
          </div>
          <button class="primary" style="width:100%;" onclick="arbitrerAvecScore('${id}')">Valider ce score</button>

  html += `</div>`;

  html += `<div class="admin-section"><h3>Matchs bloqués (${bloqueIds.length})</h3>`;
  if(!bloqueIds.length){

      const m = matches[id];

  const annulables = ALL_MATCH_IDS.filter(id => {

  // --- Terrains, groupés par vague : c'est l'unité de temps réelle du tournoi.

    <div class="empty" style="margin-bottom:10px;">Modifiable à tout moment — les téléphones se mettent à jour en quelques secondes.</div>
    <div id="terrainEdits">`;
  for(let v = 1; v <= 4; v++){
    const ids = ALL_MATCH_IDS.filter(id => vagueDe(id) === v);
    if(!ids.length) continue;
    // Détection des doublons DANS la vague uniquement.
    const compte = {};
    for(const id of ids){ const t = terrains[id]; compte[t] = (compte[t]||0) + 1; }
    html += `<div style="margin:14px 0 8px;font-size:11.5px;font-weight:700;letter-spacing:0.08em;
                text-transform:uppercase;color:var(--sable-soft);">Vague ${v} — ${ids.length} match(s)</div>`;
    for(const id of ids){
      const m = matches[id] || {};
      const conflit = compte[terrains[id]] > 1;
      const libelle = (m.teamA && m.teamB)
        ? `${esc(m.teamA)} vs ${esc(m.teamB)}`
        : `${TOPOLOGY[id].bracket === 'principal' ? 'Principal' : 'Consolante'} · ${id}`;
      html += `<div class="team-edit-row" style="gap:10px;align-items:center;">
        <span style="flex:1;min-width:0;font-size:12.5px;line-height:1.3;">${libelle}</span>
        <input type="number" min="1" max="8" value="${terrains[id] || ''}" data-match="${id}"
          style="width:62px;flex:0 0 auto;text-align:center;
                 ${conflit ? 'border-color:var(--rouille);color:#e8956a;' : ''}">
      </div>`;
    }
    const doublons = Object.keys(compte).filter(t => compte[t] > 1);
    if(doublons.length){
      html += `<div style="color:#e8956a;font-size:11.5px;margin-top:6px;">
        ⚠ Terrain ${doublons.join(', ')} attribué à plusieurs matchs de cette vague — ils ne peuvent pas se jouer en même temps.</div>`;
    }
  }
  html += `</div><div class="save-row">
    <button class="primary" onclick="saveTerrains()">Enregistrer les terrains</button>
    <button class="ghost" onclick="resetTerrains()" style="margin-left:8px;">Rétablir par défaut</button>
  </div></div>`;

  html += `<div class="admin-section"><h3>Équipes (avant démarrage)</h3><div id="teamEdits">`;
  equipes.forEach((name,i)=>{
    html += `<div class="team-edit-row"><span>${i+1}.</span><input type="text" value="${esc(name)}" data-idx="${i}"></div>`;
  });
  html += `</div><div class="save-row"><button class="primary" onclick="saveTeams()">Enregistrer les équipes</button></div></div>`;

  // Réinitialisation globale : réservée à la fin de la démonstration.
  // Réintroduite sur demande, mais protégée par un mot à taper — et toujours
  // inaccessible hors mode organisateur, IS_ADMIN étant vérifié côté fonction.
  html += `<div class="admin-section"><h3>Fin de démonstration</h3>
    <div class="empty" style="margin-bottom:10px;">Efface les scores des 22 matchs et conserve les noms d'équipe.</div>
    <button onclick="toutReinitialiser()"
      style="background:var(--rouille);color:#fff;border:none;border-radius:9px;
             padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;width:100%;">
      Tout réinitialiser</button></div>`;

  $('#adminView').innerHTML = html;
  restaurerSaisies(saisiesEnCours);
}

// Arbitrage par l'organisateur.
// scores facultatif : {scoreA, scoreB}. Quand il est fourni, c'est CE score qui
// s'affiche dans le tableau — l'ancienne version reprenait systématiquement la
// saisie de l'équipe A, si bien que trancher en faveur de B affichait quand même
// le score de A. Le tableau montrait alors un vainqueur avec le score du perdant.
async function resolveDispute(id, winnerSlot, scores){
  if(!IS_ADMIN) return;
  // Retentative sur la lecture : depuis que readMatch ne masque plus les
  // pannes réseau (elles remontent en exception), un simple accroc lors d'un
  // arbitrage ne doit pas planter l'action sans aucun message.
  let m;
  for(let tentative = 1; tentative <= 3; tentative++){
    try{ m = await readMatch(id); break; }
    catch(e){
      if(tentative === 3){ alert('Réseau indisponible — réessaie dans quelques secondes.'); return; }
      await new Promise(r => setTimeout(r, 300 + Math.random()*300));
    }
  }
  if(!m) return;
  let sA, sB;
  if(scores){
    sA = scores.scoreA; sB = scores.scoreB;
  } else {
    // Sans score explicite, on reprend celui de la saisie disponible.
    const useSub = (m.subA && m.subB) ? m.subA : (m.subA || m.subB);
    sA = useSub ? useSub.scoreA : 0;
    sB = useSub ? useSub.scoreB : 0;
  }
  m.status = 'termine';
  m.winner = winnerSlot;
  m.orga = { scoreA: sA, scoreB: sB, t: new Date().toLocaleTimeString('fr-FR') };
  try{
    await writeMatch(id, m);
  }catch(e){
    alert("Écriture impossible — vérifie le réseau et réessaie. Rien n'a été modifié.");
    return;
  }
  await propagate(id, m);
  matches[id] = m;
  render();
}

// Lit les deux champs de score de la carte de litige, contrôle la cohérence,
// puis tranche. Le vainqueur est DÉDUIT du score saisi quand les scores
// diffèrent : on ne peut pas enregistrer "13-7 pour B", ce serait afficher un
// résultat contredit par son propre score.
async function arbitrerAvecScore(id){
  if(!IS_ADMIN) return;
  const eA = document.getElementById('arbA-'+id);
  const eB = document.getElementById('arbB-'+id);
  const err = document.getElementById('arbErr-'+id);
  const sA = parseInt(eA.value), sB = parseInt(eB.value);
  err.textContent = '';
  if(isNaN(sA) || isNaN(sB)){ err.textContent = 'Renseigne les deux scores.'; return; }
  if(sA < 0 || sB < 0 || sA > 13 || sB > 13){ err.textContent = 'Un score va de 0 à 13.'; return; }

  let vainqueur;
  if(sA !== sB){
    vainqueur = sA > sB ? 'A' : 'B';
  } else {
    // Égalité possible en parties au temps : le vainqueur ne peut pas se
    // déduire du score, il faut le désigner explicitement.
    const sel = document.getElementById('arbTie-'+id);
    if(!sel || !sel.value){ err.textContent = 'Scores égaux : indique qui a gagné.'; return; }
    vainqueur = sel.value;
  }
  try{
    await resolveDispute(id, vainqueur, {scoreA:sA, scoreB:sB});
    await pollAll();
  }catch(e){
    console.error('[arbitrerAvecScore]', e);
    err.textContent = 'Enregistrement impossible, réessaie.';
  }
}

async function saveTerrains(){
  if(!IS_ADMIN) return;
  const inputs = document.querySelectorAll('#terrainEdits input[data-match]');
  const nouveaux = {};
  for(const i of inputs){
    const v = parseInt(i.value);
    if(isNaN(v) || v < 1 || v > 8){
      alert(`Terrain invalide : « ${i.value} ».\n\nChaque match doit être affecté à un terrain de 1 à 8.`);
      return;
    }
    nouveaux[i.dataset.match] = v;
  }

  // On avertit sur les doublons au sein d'une même vague, sans bloquer :
  // l'organisateur peut vouloir enchaîner deux matchs sur un même terrain s'il
  // a du retard. C'est son choix, pas une erreur de saisie à corriger d'office.
  const conflits = [];
  for(let v = 1; v <= 4; v++){
    const ids = ALL_MATCH_IDS.filter(id => vagueDe(id) === v);
    const compte = {};
    for(const id of ids){ compte[nouveaux[id]] = (compte[nouveaux[id]]||0)+1; }
    for(const t of Object.keys(compte)){
      if(compte[t] > 1) conflits.push(`vague ${v}, terrain ${t} (${compte[t]} matchs)`);
    }
  }
  if(conflits.length){
    if(!confirm(`Des matchs d'une même vague partagent un terrain :\n\n${conflits.join('\n')}\n\n`
      + `Ils ne pourront pas se jouer en même temps. Enregistrer quand même ?`)) return;
  }

  try{
    await kvSet(KEY_TERRAINS, nouveaux);
    terrains = Object.assign({}, TERRAINS_DEFAUT, nouveaux);
    await pollAll();
    alert('Terrains enregistrés. Les téléphones se mettent à jour dans les 5 secondes.');
  }catch(e){
    console.error('[saveTerrains]', e);
    alert("Enregistrement impossible — vérifie le réseau. Rien n'a été modifié.");
  }
}

async function resetTerrains(){
  if(!IS_ADMIN) return;
  if(!confirm("Rétablir l'affectation par défaut ?\n\n"
    + "Vague 1 : terrains 1 à 8\nVague 2 : quarts sur 1-4, consolante sur 5-8\n"
    + "Vague 3 : terrains 1 à 4\nVague 4 : terrains 1 et 2")) return;
  try{
    await kvSet(KEY_TERRAINS, TERRAINS_DEFAUT);
    terrains = Object.assign({}, TERRAINS_DEFAUT);
    await pollAll();
  }catch(e){
    console.error('[resetTerrains]', e);
    alert("Opération impossible — vérifie le réseau.");
  }
}

async function saveTeams(){
  const inputs = document.querySelectorAll('#teamEdits input');
  const newTeams = Array.from(inputs).map((i,idx) => i.value.trim() || `Équipe ${idx+1}`);

  // Contrôle d'unicité. La propagation recopie le NOM du vainqueur dans le match
  // suivant : deux équipes homonymes rendraient le tableau illisible et on ne
  // saurait plus laquelle est qualifiée. Comparaison insensible à la casse et
  // aux accents, parce que "Les Boulistes" et "les boulistes" poseraient le
  // même problème à l'écran.
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  const vus = new Map();
  for(let i=0;i<newTeams.length;i++){
    const k = norm(newTeams[i]);
    if(vus.has(k)){
      alert(`Deux équipes portent le même nom :\n\n`
        + `n°${vus.get(k)+1} et n°${i+1} — « ${newTeams[i]} »\n\n`
        + `Rends-les distincts avant d'enregistrer : le tableau identifie les équipes par leur nom.`);
      return;
    }
    vus.set(k, i);
  }

  try{
    const pairs = appariements(newTeams);
    const p1 = ['P1-1','P1-2','P1-3','P1-4','P1-5','P1-6','P1-7','P1-8'];

    // On relit l'état frais des 8 matchs du 1er tour en une seule requête,
    // au lieu de 8 lectures + 8 écritures séquentielles.
    const all = await kvGetAll();
    const entries = [[KEY_EQUIPES, newTeams]];
    let bloques = 0;
    for(let i=0;i<p1.length;i++){
      const m = all[KEY_MATCH_PREFIX+p1[i]];
      // Garde-fou : on ne renomme QUE les matchs pas encore engagés.
      // Renommer une équipe dont le match a déjà une saisie créerait une
      // incohérence entre le nom affiché et le nom propagé au tour suivant.
      if(m && m.status==='a_jouer' && !m.subA && !m.subB){
        m.teamA = pairs[i][0]; m.teamB = pairs[i][1];
        entries.push([KEY_MATCH_PREFIX+p1[i], m]);
      } else if(m) bloques++;
    }
    await kvSetMany(entries);
    equipes = newTeams;
    await pollAll();
    let msg = `Équipes enregistrées (${entries.length - 1} match(s) du 1er tour mis à jour).`;
    if(bloques > 0){
      msg += `\n\n⚠ ${bloques} match(s) du 1er tour sont déjà engagés : ils gardent les anciens noms.`
           + `\nPour les renommer, annule-les d'abord depuis « Annuler un match ».`;
    }
    alert(msg);
  }catch(e){
    console.error('[saveTeams]', e);
    alert("Enregistrement impossible — vérifie le réseau et réessaie. Rien n'a été modifié.");
  }
}

(async function init(){
  // ensureInit() laisse volontairement remonter ses erreurs : un échec de lecture
  // ne doit jamais être confondu avec une base vide (cf. commentaire d'ensureInit).
  // On réessaie en boucle plutôt que de rester bloqué sur "connexion…" — c'était
  // exactement le symptôme observé lors du premier déploiement.
  let ok = false, dernierMotif = '';
  for(let essai = 1; essai <= 3 && !ok; essai++){
    try{
      await ensureInit();
      ok = true;
    }catch(e){
      dernierMotif = e.message || String(e);
      setSync(false, `connexion impossible (essai ${essai}/3)`);
      console.error('[init] échec de lecture Supabase :', e);
      if(essai < 3) await new Promise(r => setTimeout(r, 1500));
    }
  }
  if(!ok){
    setSync(false, 'connexion impossible');
    showFatal('Impossible de joindre la base de données.\n\nMotif : ' + dernierMotif
      + '\n\nVérifie ta connexion et actualise la page. Si le message persiste, '
      + 'montre-le à l\'organisateur.');
  } else {
    hideFatal();
    render();
    await pollAll();   // pollAll() se charge déjà de vider la file après sa 1re synchro réussie
  }
  // Bandeau visible dès le chargement si une saisie est restée en attente
  // d'une session précédente (téléphone fermé avant la reconnexion).
  majBandeauFile();

  // Le polling tourne dans tous les cas : si le réseau revient, l'app se rattrape
  // toute seule sans que personne n'ait à recharger la page.
  pollTimer = setInterval(()=>{
    if(document.visibilityState === 'visible') pollAll();
  }, 5000);
})();
</script>
